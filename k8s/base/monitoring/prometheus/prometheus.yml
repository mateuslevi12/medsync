global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "auth-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: "users-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["users-service:8082"]

  - job_name: "patients-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["patients-service:8083"]

  - job_name: "triage-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["triage-service:8084"]

  - job_name: "notifications-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notifications-service:8085"]

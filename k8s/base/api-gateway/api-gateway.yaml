apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: medsync
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: medsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: medsync
    spec:
      containers:
        - name: api-gateway
          image: medsync-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: AUTH_SERVICE_URL
            - name: USERS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: USERS_SERVICE_URL
            - name: PATIENTS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: PATIENTS_SERVICE_URL
            - name: TRIAGE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: TRIAGE_SERVICE_URL
            - name: NOTIFICATIONS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: NOTIFICATIONS_SERVICE_URL
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: FRONTEND_URL
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: medsync
spec:
  ingressClassName: nginx
  rules:
    - host: api.medsync.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

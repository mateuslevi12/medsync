apiVersion: v1
kind: Service
metadata:
  name: medical-record-service
  labels:
    app.kubernetes.io/name: medical-record-service
    app.kubernetes.io/part-of: medsync
spec:
  ports:
    - name: http
      port: 8086
      targetPort: 8086
  selector:
    app.kubernetes.io/name: medical-record-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-record-service
  labels:
    app.kubernetes.io/name: medical-record-service
    app.kubernetes.io/part-of: medsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: medical-record-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medical-record-service
        app.kubernetes.io/part-of: medsync
    spec:
      containers:
        - name: medical-record-service
          image: medsync-medical-record-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: MONGODB_URI
            - name: MONGODB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: MONGODB_DATABASE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: INTERNAL_SERVICE_TOKEN
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP
              value: medical-record-service
            - name: KAFKA_TOPIC_AMBULATORY_FLOW
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KAFKA_TOPIC_AMBULATORY_FLOW
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

apiVersion: v1
kind: Service
metadata:
  name: patients-service
  labels:
    app.kubernetes.io/name: patients-service
    app.kubernetes.io/part-of: medsync
spec:
  ports:
    - name: http
      port: 8083
      targetPort: 8083
  selector:
    app.kubernetes.io/name: patients-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patients-service
  labels:
    app.kubernetes.io/name: patients-service
    app.kubernetes.io/part-of: medsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: patients-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patients-service
        app.kubernetes.io/part-of: medsync
    spec:
      containers:
        - name: patients-service
          image: medsync-patients-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: DB_URL_PATIENTS
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: JWT_SECRET
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: REDIS_PORT
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

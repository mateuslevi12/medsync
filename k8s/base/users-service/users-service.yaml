apiVersion: v1
kind: Service
metadata:
  name: users-service
  labels:
    app.kubernetes.io/name: users-service
    app.kubernetes.io/part-of: medsync
spec:
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  selector:
    app.kubernetes.io/name: users-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  labels:
    app.kubernetes.io/name: users-service
    app.kubernetes.io/part-of: medsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: users-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: users-service
        app.kubernetes.io/part-of: medsync
    spec:
      containers:
        - name: users-service
          image: medsync-users-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: DB_URL_USERS
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: INTERNAL_SERVICE_TOKEN
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

server:
  port: 8085

spring:
  application:
    name: notifications-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/notifications_db}
    username: ${DB_USERNAME:medsync}
    password: ${DB_PASSWORD:medsync123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notifications-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.medsync.notifications.messaging.EventEnvelope

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
    description: MedSync Notifications Service

app:
  jwt:
    secret: ${JWT_SECRET:medsync-super-secret-key-for-jwt-demo-1234567890}
  kafka:
    topics:
      triage-created: ${KAFKA_TOPIC_TRIAGE_CREATED:triage.created}
      triage-updated: ${KAFKA_TOPIC_TRIAGE_UPDATED:triage.updated}
      triage-priority-changed: ${KAFKA_TOPIC_TRIAGE_PRIORITY_CHANGED:triage.priority.changed}

server:
  port: 8081

spring:
  application:
    name: auth-service

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
    description: MedSync Auth Service

app:
  users-service-url: ${USERS_SERVICE_URL:http://localhost:8082}
  internal-token: ${INTERNAL_SERVICE_TOKEN:medsync-internal-token}
  jwt:
    secret: ${JWT_SECRET:medsync-super-secret-key-for-jwt-demo-1234567890}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

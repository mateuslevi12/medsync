name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Tag de ambiente para as imagens"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Build Metadata
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.prepare.outputs.image_prefix }}
      short_sha: ${{ steps.prepare.outputs.short_sha }}
      release_channel: ${{ steps.prepare.outputs.release_channel }}
      frontend_gateway_url: ${{ steps.prepare.outputs.frontend_gateway_url }}
    steps:
      - name: Compute build variables
        id: prepare
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          WORKFLOW_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
          REGISTRY_IMAGE_PREFIX_VAR: ${{ vars.REGISTRY_IMAGE_PREFIX }}
          STAGING_API_GATEWAY_URL_VAR: ${{ vars.STAGING_API_GATEWAY_URL }}
          PRODUCTION_API_GATEWAY_URL_VAR: ${{ vars.PRODUCTION_API_GATEWAY_URL }}
        run: |
          set -euo pipefail

          image_prefix="${REGISTRY_IMAGE_PREFIX_VAR:-}"
          if [ -z "$image_prefix" ]; then
            owner="$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            image_prefix="ghcr.io/${owner}"
          fi
          image_prefix="${image_prefix%/}"

          release_channel="staging"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_channel="${WORKFLOW_RELEASE_CHANNEL}"
          fi

          if [ "$release_channel" = "production" ]; then
            frontend_gateway_url="${PRODUCTION_API_GATEWAY_URL_VAR:-}"
            if [ -z "$frontend_gateway_url" ]; then
              frontend_gateway_url="http://api.production.medsync.local"
            fi
          else
            frontend_gateway_url="${STAGING_API_GATEWAY_URL_VAR:-}"
            if [ -z "$frontend_gateway_url" ]; then
              frontend_gateway_url="http://api.staging.medsync.local"
            fi
          fi

          {
            echo "image_prefix=$image_prefix"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "release_channel=$release_channel"
            echo "frontend_gateway_url=$frontend_gateway_url"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and Push (${{ matrix.image_name }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: medsync-api-gateway
            context: backend/api-gateway
          - image_name: medsync-auth-service
            context: backend/auth-service
          - image_name: medsync-users-service
            context: backend/users-service
          - image_name: medsync-patients-service
            context: backend/patients-service
          - image_name: medsync-triage-service
            context: backend/triage-service
          - image_name: medsync-notifications-service
            context: backend/notifications-service
          - image_name: medsync-frontend
            context: frontend/medsync-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.short_sha }}
            type=raw,value=${{ needs.prepare.outputs.release_channel }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_GATEWAY_URL=${{ needs.prepare.outputs.frontend_gateway_url }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
